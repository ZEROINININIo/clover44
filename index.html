<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Labs Archive // RELIC</title>
    <!-- Removed importmap to prevent conflicts with bundlers (Vite/Webpack) on Vercel -->
    <link rel="icon" href="https://cdn.imgos.cn/vip/2026/01/02/6957e8e22304e.png" />
    
    <!-- Preload the main font to prevent FOIT/FOUT - Local Backup First -->
    <link rel="preload" href="/02.ttf" as="font" type="font/ttf" crossorigin>
    
    <style>
      :root {
        /* Default Dark Theme (Ash/Zinc) */
        --ash-black: #09090b;
        --ash-dark: #18181b;
        --ash-gray: #71717a;
        --ash-light: #e4e4e7;
        --ash-white: #fafafa;
        --retro-paper: #d4d4d8;
        
        --foreground: #e4e4e7;
        --background: #09090b;
        
        --grid-color: #27272a;
        --halftone-color: #27272a;
      }

      html {
        background-color: var(--background);
      }

      @font-face {
        font-family: 'CustomFont02';
        src: url('/02.ttf') format('truetype'),
             url('https://lz.qaiu.top/parser?url=https://sbcnm.lanzoum.com/iMv0y3ghi9ed') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'RetroPixel';
        src: url('/x.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'BloodFont';
        src: url('https://lz.qaiu.top/parser?url=https://sbcnm.lanzoum.com/ibalR3ld50zi') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      body.light-theme {
        /* Light Theme Mapping (Inverted Contrast) */
        --ash-black: #fafafa; /* Main BG becomes Light */
        --ash-dark: #e4e4e7;  /* Secondary BG becomes lighter grey */
        --ash-gray: #52525b;  /* Gray text becomes darker for readability */
        --ash-light: #18181b; /* Light Text becomes Dark Text */
        --ash-white: #09090b; /* White Accents become Black Accents */
        --retro-paper: #e4e4e7; /* Paper stays light greyish */
        
        --foreground: #18181b;
        --background: #fafafa;
        
        --grid-color: #e4e4e7;
        --halftone-color: #e4e4e7;
      }
      
      body {
        background-color: var(--background);
        color: var(--foreground);
        font-family: 'CustomFont02', 'JetBrains Mono', monospace;
        overflow-x: hidden;
        transition: background-color 0.3s ease, color 0.3s ease;
        margin: 0;
      }

      /* Global Reset for Retro Feel */
      * {
        border-radius: 0 !important; /* STRICT NO ROUNDED CORNERS */
        border-color: var(--ash-gray); /* Default border color fallback */
      }

      /* Custom Hard Scrollbar */
      ::-webkit-scrollbar {
        width: 12px;
        background: var(--ash-dark);
        border-left: 1px solid var(--ash-gray);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--ash-gray); 
        border: 2px solid var(--ash-dark);
        box-shadow: inset 1px 1px 0px rgba(255,255,255,0.2);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--ash-light); 
      }

      /* Texture Patterns */
      .bg-halftone {
        background-image: radial-gradient(var(--halftone-color) 1px, transparent 1px);
        background-size: 4px 4px;
      }
      
      .bg-grid-hard {
        background-image: 
          linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
        background-size: 20px 20px;
      }

      /* Noise overlay */
      .noise-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 9997;
        opacity: 0.03;
        background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
      }
      
      /* Hard Shadow Utility */
      .shadow-hard {
        box-shadow: 4px 4px 0px 0px currentColor;
      }
      .shadow-hard-sm {
        box-shadow: 2px 2px 0px 0px currentColor;
      }

      /* === CRT EFFECTS === */
      
      /* 1. Scanlines */
      body.crt-enabled::before {
        content: " ";
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.1) 50%,
          rgba(0,0,0,0.1)
        );
        background-size: 100% 4px;
        z-index: 9998;
        pointer-events: none;
        animation: scanline 8s linear infinite;
      }

      /* Legacy Readable Glitch Effect */
      .legacy-text {
        text-shadow: 1px 0 0 rgba(255,0,0,0.4), -1px 0 0 rgba(0,0,255,0.4);
        animation: text-flicker 4s infinite;
      }
      @keyframes text-flicker {
        0% { opacity: 1; }
        95% { opacity: 1; }
        96% { opacity: 0.8; transform: skewX(1deg); }
        97% { opacity: 1; transform: skewX(0deg); }
        98% { opacity: 1; }
        99% { opacity: 0.9; }
        100% { opacity: 1; }
      }

      /* Heavy Glitch Effect for Admin/Special Text */
      .glitch-text-heavy {
        position: relative;
        /* color: #ef4444; */ /* handled by utility classes */
        font-weight: 900;
        text-transform: uppercase;
      }
      .glitch-text-heavy::before,
      .glitch-text-heavy::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--background);
        opacity: 0.8;
      }
      .glitch-text-heavy::before {
        left: 2px;
        text-shadow: -1px 0 #00ffff;
        clip: rect(44px, 450px, 56px, 0);
        animation: glitch-anim-1 5s infinite linear alternate-reverse;
      }
      .glitch-text-heavy::after {
        left: -2px;
        text-shadow: -1px 0 #ff00ff;
        clip: rect(44px, 450px, 56px, 0);
        animation: glitch-anim-2 5s infinite linear alternate-reverse;
      }
      @keyframes glitch-anim-1 {
        0% { clip: rect(10px, 9999px, 86px, 0); }
        5% { clip: rect(41px, 9999px, 8px, 0); }
        10% { clip: rect(98px, 9999px, 71px, 0); }
        15% { clip: rect(55px, 9999px, 12px, 0); }
        20% { clip: rect(32px, 9999px, 94px, 0); }
        25% { clip: rect(74px, 9999px, 23px, 0); }
        30% { clip: rect(15px, 9999px, 67px, 0); }
        35% { clip: rect(88px, 9999px, 45px, 0); }
        40% { clip: rect(2px, 9999px, 89px, 0); }
        45% { clip: rect(63px, 9999px, 34px, 0); }
        50% { clip: rect(27px, 9999px, 78px, 0); }
        55% { clip: rect(91px, 9999px, 11px, 0); }
        60% { clip: rect(48px, 9999px, 56px, 0); }
        65% { clip: rect(19px, 9999px, 92px, 0); }
        70% { clip: rect(82px, 9999px, 37px, 0); }
        75% { clip: rect(5px, 9999px, 64px, 0); }
        80% { clip: rect(71px, 9999px, 29px, 0); }
        85% { clip: rect(38px, 9999px, 81px, 0); }
        90% { clip: rect(95px, 9999px, 16px, 0); }
        95% { clip: rect(22px, 9999px, 53px, 0); }
        100% { clip: rect(69px, 9999px, 97px, 0); }
      }
      @keyframes glitch-anim-2 {
        0% { clip: rect(85px, 9999px, 12px, 0); }
        5% { clip: rect(24px, 9999px, 67px, 0); }
        10% { clip: rect(71px, 9999px, 34px, 0); }
        15% { clip: rect(16px, 9999px, 89px, 0); }
        20% { clip: rect(93px, 9999px, 45px, 0); }
        25% { clip: rect(38px, 9999px, 78px, 0); }
        30% { clip: rect(62px, 9999px, 23px, 0); }
        35% { clip: rect(9px, 9999px, 91px, 0); }
        40% { clip: rect(87px, 9999px, 56px, 0); }
        45% { clip: rect(44px, 9999px, 11px, 0); }
        50% { clip: rect(79px, 9999px, 64px, 0); }
        55% { clip: rect(31px, 9999px, 92px, 0); }
        60% { clip: rect(58px, 9999px, 37px, 0); }
        65% { clip: rect(14px, 9999px, 81px, 0); }
        70% { clip: rect(96px, 9999px, 29px, 0); }
        75% { clip: rect(47px, 9999px, 74px, 0); }
        80% { clip: rect(21px, 9999px, 53px, 0); }
        85% { clip: rect(68px, 9999px, 16px, 0); }
        90% { clip: rect(5px, 9999px, 97px, 0); }
        95% { clip: rect(83px, 9999px, 42px, 0); }
        100% { clip: rect(35px, 9999px, 69px, 0); }
      }

      /* Settings Modal Animations */
      @keyframes drift-diagonal {
        0% { background-position: 0 0; }
        100% { background-position: 40px 40px; }
      }
      @keyframes scanline-vertical {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100vh); }
      }
      @keyframes pulse-glow-cyan {
        0%, 100% { opacity: 0.1; }
        50% { opacity: 0.3; }
      }
      @keyframes glitch-border {
        0% { clip-path: inset(0 0 95% 0); }
        20% { clip-path: inset(80% 0 0 0); }
        40% { clip-path: inset(10% 0 80% 0); }
        60% { clip-path: inset(40% 0 40% 0); }
        80% { clip-path: inset(0 0 80% 0); }
        100% { clip-path: inset(90% 0 0 0); }
      }
      
      .animate-drift-diagonal { animation: drift-diagonal 20s linear infinite; }
      .animate-scanline-vertical { animation: scanline-vertical 8s linear infinite; }
      .animate-pulse-glow-cyan { animation: pulse-glow-cyan 4s ease-in-out infinite; }
      .animate-glitch-border { animation: glitch-border 2s infinite linear alternate-reverse; }

      /* Pre-loader Styles */
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* Pre-loader specific styles */
      .loading-container {
        position: fixed;
        inset: 0; /* Ensures full cover on mobile */
        width: 100%;
        height: 100%;
        background-color: #09090b;
        color: #71717a;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        /* Using system fonts for loader to ensure text visibility before custom font loads */
        font-family: 'JetBrains Mono', monospace, sans-serif;
        z-index: 99999; /* Higher than almost everything */
        transition: opacity 0.5s ease-out;
      }
      .star-icon {
        width: 64px;
        height: 64px;
        margin-bottom: 32px;
        fill: #e4e4e7;
        animation: star-pulse 2s infinite ease-in-out;
        filter: drop-shadow(0 0 8px rgba(228, 228, 231, 0.4));
      }
      /* New Trilingual Text Styles */
      .trilingual-loader-text {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        margin-bottom: 16px;
        text-align: center;
        width: 100%;
      }
      .loader-row {
        opacity: 0;
        animation: decodeText 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      .loader-row.cn {
        color: #e4e4e7;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.2em;
        animation-delay: 0.1s;
        text-shadow: 0 0 5px rgba(228, 228, 231, 0.3);
      }
      .loader-row.tw {
        color: #d4d4d8;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.25em;
        animation-delay: 0.25s;
        opacity: 0.8;
      }
      .loader-row.en {
        color: #71717a;
        font-size: 10px;
        font-weight: 400;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        animation-delay: 0.4s;
        border-top: 1px solid rgba(113, 113, 122, 0.3);
        padding-top: 4px;
        margin-top: 2px;
      }
      @keyframes decodeText {
        0% { opacity: 0; transform: translateY(5px); clip-path: polygon(0 0, 100% 0, 100% 0, 0 0); }
        100% { opacity: 1; transform: translateY(0); clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
      }

      .loading-bar {
        width: 240px;
        height: 2px;
        background-color: #27272a;
        position: relative;
        overflow: hidden;
      }
      #progress-fill {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 0%;
        background-color: #e4e4e7;
        box-shadow: 0 0 10px rgba(228, 228, 231, 0.5);
        transition: width 0.2s ease-out;
      }
      .progress-info {
        font-size: 10px;
        color: #52525b;
        margin-top: 8px;
        letter-spacing: 0.1em;
      }
      .file-loading {
        font-size: 10px;
        color: #52525b;
        margin-top: 4px;
        height: 14px;
        opacity: 0.7;
        text-transform: uppercase;
      }
      .loader-timer {
        position: absolute;
        bottom: 20px;
        right: 20px;
        font-size: 12px;
        color: #52525b;
        font-weight: bold;
        letter-spacing: 0.1em;
      }
      @keyframes star-pulse {
        0%, 100% { transform: scale(0.9); opacity: 0.7; }
        50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 12px rgba(228, 228, 231, 0.8)); }
      }
      @keyframes text-blink {
        0% { opacity: 0.5; }
        100% { opacity: 1; }
      }
      
      /* Explicit Keyframes for Inline Styles */
      @keyframes dataRainCard {
        0% { transform: translateY(0); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(300px); opacity: 0; }
      }
      @keyframes dataRain {
        0% { transform: translateY(-100%); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateY(100vh); opacity: 0; }
      }

      /* === ATMOSPHERIC KEYFRAMES FOR INLINE STYLES === */
      @keyframes drift-vertical {
        0% { transform: translateY(120vh) scale(0.5); opacity: 0; }
        10% { opacity: var(--base-opacity, 0.5); }
        90% { opacity: var(--base-opacity, 0.5); }
        100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
      }
      @keyframes drift-horizontal {
        0% { transform: translateX(-50px) rotateZ(-5deg); }
        100% { transform: translateX(50px) rotateZ(5deg); }
      }
      @keyframes tumble-3d {
        0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
        33% { transform: rotateX(120deg) rotateY(60deg) rotateZ(10deg); }
        66% { transform: rotateX(240deg) rotateY(120deg) rotateZ(-10deg); }
        100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(0deg); }
      }
      @keyframes pulse-glow {
        0% { opacity: 0.3; transform: scale(1); }
        100% { opacity: 0.6; transform: scale(1.2); }
      }
      @keyframes beam-scan {
        0% { transform: translateX(-20%) rotate(15deg); opacity: 0; }
        20% { opacity: 0.1; }
        80% { opacity: 0.1; }
        100% { transform: translateX(120%) rotate(15deg); opacity: 0; }
      }
    </style>

    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Noto+Serif+SC:wght@400;700&family=JetBrains+Mono:wght@400;800&display=swap"></noscript>
</head>
  <body>
    <!-- Initial Pre-loader (Outside Root for persistence) -->
    <div id="initial-loader" class="loading-container">
        <!-- New Data Core Icon -->
        <svg class="star-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 0 L65 35 L100 50 L65 65 L50 100 L35 65 L0 50 L35 35 Z" />
            <circle cx="50" cy="50" r="15" fill="#09090b" />
            <circle cx="50" cy="50" r="8" fill="currentColor"/>
        </svg>
        
        <!-- Trilingual Loading Text Block -->
        <div class="trilingual-loader-text" id="loader-text-block">
            <div class="loader-row cn">正在建立加密连接...</div>
            <div class="loader-row tw">正在建立加密連接...</div>
            <div class="loader-row en">ESTABLISHING ENCRYPTED LINK...</div>
        </div>

        <div class="loading-bar">
            <div id="progress-fill"></div>
        </div>
        <div id="progress-text" class="progress-info">0%</div>
        <div id="current-file" class="file-loading">SCANNING_MODULES...</div>
        
        <div class="loader-timer" id="loader-timer">T+ 0.000s</div>
        
        <div id="error-msg" style="display:none; color: #ef4444; font-size: 10px; margin-top: 10px; max-width: 80%; text-align: center;"></div>
    </div>

    <!-- Progress Real-Time Script using Performance API -->
    <script>
      (function(){
        var bar = document.getElementById('progress-fill');
        var txt = document.getElementById('progress-text');
        var fileTxt = document.getElementById('current-file');
        var timerTxt = document.getElementById('loader-timer');
        var val = 0;
        var startTime = Date.now();
        var processedCount = 0;

        var interval = setInterval(function(){
           if (!bar || !txt) return;
           
           // Update Timer
           var now = Date.now();
           var elapsed = (now - startTime) / 1000;
           if (timerTxt) timerTxt.innerText = 'T+ ' + elapsed.toFixed(3) + 's';

           // Get Real Resources from Performance API
           var resources = performance.getEntriesByType('resource');
           
           if (resources.length > 0) {
               // Get the latest loaded resource
               var lastResource = resources[resources.length - 1];
               var url = lastResource.name;
               
               // Try to extract a clean filename
               try {
                   var urlObj = new URL(url);
                   var path = urlObj.pathname;
                   
                   // Clean up common paths for "Geek" aesthetic
                   if (path.startsWith('/node_modules/')) {
                       path = 'LIB' + path.substring(13);
                   } else if (path.startsWith('/src/')) {
                       path = 'SRC' + path.substring(4);
                   } else if (path.startsWith('/')) {
                       path = path.substring(1);
                   }
                   
                   // Decode any percent-encoding
                   path = decodeURIComponent(path);
                   
                   // Truncate if too long
                   if (path.length > 40) {
                       path = '...' + path.slice(-35);
                   }
                   
                   if (fileTxt) fileTxt.innerText = "LOADED: " + path;
               } catch(e) {
                   // Fallback
                   if (fileTxt) fileTxt.innerText = "LOADED: " + url.substring(0, 30) + "...";
               }
           }

           // Update progress bar based on resource count changes
           // We simulate progress but bump it when new files actually arrive
           if (resources.length > processedCount) {
               var diff = resources.length - processedCount;
               val += diff * 1.5; // Bump progress
               processedCount = resources.length;
           } else {
               val += 0.1; // Slow idle creep
           }
           
           if (val > 98) val = 98; // Cap until app finishes
           
           bar.style.width = val + '%';
           txt.innerText = 'SYSTEM_INIT // ' + Math.floor(val) + '%';
           
           // Stop if element is removed (App loaded)
           if (!document.getElementById('initial-loader')) clearInterval(interval);
        }, 50);
        
        window._loaderInterval = interval;
      })();
    </script>

    <div id="root"></div>
    
    <!-- Fail-safe script: Only reports error, does not auto-hide -->
    <script>
      window.addEventListener('error', function(e) {
        const loader = document.getElementById('initial-loader');
        const errText = document.getElementById('error-msg');
        const loadTextBlock = document.getElementById('loader-text-block');
        
        if (loader && errText) {
           if (loadTextBlock) {
               loadTextBlock.innerHTML = '<div style="color: #ef4444; font-weight: bold; font-size: 14px; letter-spacing: 0.2em;">CONNECTION FAILED</div>';
           }
           errText.style.display = "block";
           errText.innerText = "ERR: " + e.message;
        }
      });
    </script>
    
    <script type="module" src="/index.tsx"></script>
  </body>
